services:
  - type: web
    name: skaltair-platform
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: skaltair-platform
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: skaltair
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUBMISSION_NOTIFICATION_EMAIL
        sync: false
